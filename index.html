</p>
</section>

<section class="card hidden" id="aboutSection">
<h2>🌸 हमारे बारे में 🌷🦋</h2>
<p>💗 स्वागत है Muskan Study में!</p>
<p>🌺 यहाँ पढ़ाई करो, नोट्स बनाओ, Quiz खेलो और अपने सपनों को पूरा करने की तैयारी करो।</p>
<p>🌸🌷🌺🦋🌼🌸🌷🌺🦋</p>
</section>

</main>

<footer>
🌸 Muskan Study 🌷 Learn • Practice • Grow 🦋🌺
</footer>

<script>
// Supabase Project URL और Publishable Key यहाँ डालें।
const SUPABASE_URL = "https://hukbvxfermaojniuyaaq.supabase.co/rest/v1/";
const SUPABASE_KEY = ""sb_publishable_6REoUbBQy8sKHYW9Ts9YcQ_hjImOWKG;

let db = null;
let user = null;
let timerInterval = null;
let remaining = 1500;
let questionIndex = 0;
let score = 0;
let answered = false;

if (window.supabase &&
    SUPABASE_URL.startsWith("https://") &&
    !SUPABASE_URL.includes("YOUR_SUPABASE")) {
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}

const questions = [
  {q:"🌸 भारत की राजधानी क्या है?", options:["मुंबई","नई दिल्ली","जयपुर"], answer:1},
  {q:"🌷 पौधे अपना भोजन किस प्रक्रिया से बनाते हैं?", options:["प्रकाश संश्लेषण","पाचन","वाष्पीकरण"], answer:0},
  {q:"🌺 पानी का रासायनिक सूत्र क्या है?", options:["CO2","O2","H2O"], answer:2}
];

function showSection(id) {
  document.querySelectorAll("main > section").forEach(s => s.classList.add("hidden"));
  document.getElementById("appCard").classList.remove("hidden");
  document.getElementById(id).classList.remove("hidden");
  if(id==="notesSection") loadNotes();
  if(id==="doubtSection") loadDoubts();
  if(id==="profileSection") showProfile();
}

function showHome() {
  document.querySelectorAll("main > section").forEach(s => s.classList.add("hidden"));
  document.getElementById("appCard").classList.remove("hidden");
}

function showUser() {
  if(!user) return;
  const meta = user.user_metadata || {};
  document.getElementById("authCard").classList.add("hidden");
  document.getElementById("appCard").classList.remove("hidden");
  document.getElementById("welcome").textContent = "🌸 Welcome, " + (meta.name || "Student") + "! 🦋";
  document.getElementById("profileInfo").textContent = "🌷 कक्षा " + (meta.class_name || "11") + " • पढ़ाई शुरू करो! 🌺";
  showHome();
}

async function signUp() {
  if(!db) return alert("🌸 पहले कोड में Supabase Project URL और Publishable Key भरो।");
  const name = document.getElementById("signupName").value.trim();
  const username = document.getElementById("signupUsername").value.trim();
  const className = document.getElementById("signupClass").value;
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;
  if(!name || !username || !email || !password) return alert("🌷 सभी जानकारी भरो।");
  if(password.length < 6) return alert("🌺 Password कम से कम 6 अक्षरों का होना चाहिए।");
  try {
    const {data,error} = await db.auth.signUp({
      email,password,
      options:{data:{name,username,class_name:className}}
    });
    if(error) throw error;
    if(data.session) {
      user = data.user;
      showUser();
    } else {
      document.getElementById("authMessage").textContent = "🌸 अकाउंट बनाने का अनुरोध हो गया। Email verification की जरूरत हो तो Email verify करके Login करो।";
    }
  } catch(e) {
    alert("🌺 Signup नहीं हुआ: " + e.message);
  }
}

async function logIn() {
  if(!db) return alert("🌸 पहले Supabase URL और Publishable Key भरो।");
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  try {
    const {data,error} = await db.auth.signInWithPassword({email,password});
    if(error) throw error;
    user = data.user;
    showUser();
  } catch(e) {
    alert("🌷 Login नहीं हुआ: " + e.message);
  }
}

async function resetPassword() {
  if(!db) return alert("🌸 पहले Supabase सेट करो।");
  const email = document.getElementById("loginEmail").value.trim();
  if(!email) return alert("🌷 पहले Login वाले बॉक्स में Email लिखो।");
  const {error} = await db.auth.resetPasswordForEmail(email);
  alert(error ? error.message : "🌺 अगर Email मौजूद है, तो Password reset का संदेश आएगा।");
}

async function logOut() {
  if(db) await db.auth.signOut();
  user = null;
  document.getElementById("appCard").classList.add("hidden");
  document.getElementById("authCard").classList.remove("hidden");
  showHome();
}

async function saveNote() {
  if(!user || !db) return alert("🌸 पहले Login और Database सेटअप करो।");
  const title = document.getElementById("noteTitle").value.trim();
  const subject = document.getElementById("noteSubject").value;
  const content = document.getElementById("noteContent").value.trim();
  if(!title || !content) return alert("🌷 नोट का नाम और सामग्री लिखो।");
  try {
    const {error} = await db.from("notes").insert({
      title,subject,content,class_name:"Class " + (user.user_metadata?.class_name || "11"),
      user_id:user.id
    });
    if(error) throw error;
    document.getElementById("noteTitle").value = "";
    document.getElementById("noteContent").value = "";
    alert("🌺 नोट सेव हो गया!");
    loadNotes();
  } catch(e) {
    alert("🌷 नोट सेव नहीं हुआ: " + e.message);
  }
}

async function loadNotes() {
  const box = document.getElementById("notesList");
  box.textContent = "🌸 नोट्स लोड हो रहे हैं...";
  if(!db || !user) { box.textContent = "🌷 Login और Database कनेक्शन जरूरी है।"; return; }
  try {
    const {data,error} = await db.from("notes")
      .select("title,subject,content,created_at")
      .order("created_at",{ascending:false}).limit(50);
    if(error) throw error;
    box.innerHTML = "";
    if(!data.length) { box.textContent = "🌺 अभी कोई नोट नहीं है।"; return; }
    data.forEach(n => {
      const div = document.createElement("div");
      div.className = "item";
      const title = document.createElement("h3");
      title.textContent = "🌸 " + n.title + " • " + n.subject;
      const content = document.createElement("p");
      content.textContent = n.content;
      div.append(title,content);
      box.append(div);
    });
  } catch(e) {
    box.textContent = "🌷 Notes table या Database policy जाँचें: " + e.message;
  }
}

function renderQuestion() {
  const q = questions[questionIndex];
  document.getElementById("quizQuestion").textContent = q.q;
  const box = document.getElementById("quizOptions");
  box.innerHTML = "";
  document.getElementById("quizResult").textContent = "";
  answered = false;
  q.options.forEach((option,i) => {
    const button = document.createElement("button");
    button.textContent = "🌸 " + option;
    button.onclick = () => checkAnswer(i);
    box.append(button);
  });
}

function checkAnswer(i) {
  if(answered) return;
  answered = true;
  const correct = i === questions[questionIndex].answer;
  if(correct) score++;
  document.getElementById("quizResult").textContent =
    correct ? "🌺 सही जवाब! बहुत बढ़िया! 🦋" :
    "🌷 सही जवाब: " + questions[questionIndex].options[questions[questionIndex].answer];
}

async function nextQuestion() {
  if(!answered) return alert("🌸 पहले एक जवाब चुनो।");
  if(questionIndex < questions.length-1) {
    questionIndex++;
    renderQuestion();
  } else {
    document.getElementById("quizQuestion").textContent = "🌺 Quiz पूरा हुआ!";
    document.getElementById("quizOptions").innerHTML = "";
    document.getElementById("quizResult").textContent = "🌸 तुम्हारा स्कोर: " + score + "/" + questions.length + " 🦋";
    if(db && user) {
      try {
        await db.from("quiz_results").insert({user_id:user.id,score,total:questions.length});
      } catch(e) {
        console.log("Quiz result save issue:",e.message);
      }
    }
    questionIndex = 0;
    score = 0;
  }
}

function updateTimer() {
  const m = Math.floor(remaining/60);
  const s = remaining%60;
  document.getElementById("timer").textContent =
    String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}

function startTimer() {
  if(timerInterval) return;
  const chosen = Number(document.getElementById("timerMinutes").value);
  if(remaining <= 0 || remaining === 1500) remaining = chosen*60;
  document.getElementById("timerMessage").textContent = "🌸 पढ़ाई पर ध्यान दो! 🦋";
  updateTimer();
  timerInterval = setInterval(async () => {
    remaining--;
    updateTimer();
    if(remaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      document.getElementById("timerMessage").textContent = "🌺 समय पूरा हुआ! थोड़ा आराम करो।";
      if(db && user) {
        try {
          await db.from("study_sessions").insert({user_id:user.id,duration_seconds:chosen*60});
        } catch(e) {
          console.log("Study session save issue:",e.message);
        }
      }
      alert("🌸 बहुत बढ़िया! Study time पूरा हुआ। 🌷");
    }
  },1000);
}

function pauseTimer() {
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = null;
  document.getElementById("timerMessage").textContent = "🌷 टाइमर रोक दिया गया।";
}

function resetTimer() {
  pauseTimer();
  remaining = Number(document.getElementById("timerMinutes").value)*60;
  updateTimer();
  document.getElementById("timerMessage").textContent = "🌸 फिर से शुरू करने के लिए Start दबाओ।";
}

async function saveDoubt() {
  if(!user || !db) return alert("🌸 पहले Login और Database सेटअप करो।");
  const subject = document.getElementById("doubtSubject").value;
  const content = document.getElementById("doubtContent").value.trim();
  if(!content) return alert("🌷 अपना सवाल लिखो।");
  try {
    const {error} = await db.from("doubts").insert({user_id:user.id,subject,content});
    if(error) throw error;
    document.getElementById("doubtContent").value = "";
    alert("🌺 सवाल सेव हो गया!");
    loadDoubts();
  } catch(e) {
    alert("🌷 सवाल सेव नहीं हुआ: " + e.message);
  }
}

async function loadDoubts() {
  const box = document.getElementById("doubtList");
  if(!db || !user) { box.textContent = "🌸 पहले Login करो।"; return; }
  box.textContent = "🌷 सवाल लोड हो रहे हैं...";
  try {
    const {data,error} = await db.from("doubts")
      .select("subject,content,created_at")
      .eq("user_id",user.id).order("created_at",{ascending:false}).limit(30);
    if(error) throw error;
    box.innerHTML = "";
    if(!data.length) { box.textContent = "🌺 अभी कोई सवाल नहीं है।"; return; }
    data.forEach(d => {
      const div = document.createElement("div");
      div.className = "item";
      const title = document.createElement("h3");
      title.textContent = "🌸 " + d.subject;
      const p = document.createElement("p");
      p.textContent = d.content;
      div.append(title,p);
      box.append(div);
    });
  } catch(e) {
    box.textContent = "🌷 Doubts table या Database policy जाँचें: " + e.message;
  }
}

function showProfile() {
  const meta = user?.user_metadata || {};
  document.getElementById("profileDetails").textContent =
    "🌸 नाम: " + (meta.name || "—") +
    "\n🌷 Username: " + (meta.username || "—") +
    "\n🌺 कक्षा: " + (meta.class_name || "—") +
    "\n📧 Email: " + (user?.email || "—") +
    "\n🦋 पढ़ाई करते रहो!";
}

if(db) {
  db.auth.getSession().then(({data}) => {
    if(data.session) {
      user = data.session.user;
      showUser();
    }
  });
  db.auth.onAuthStateChange((_event,session) => {
    if(session) {
      user = session.user;
      showUser();
    }
  });
}

updateTimer();
</script>
</body>
</html>
